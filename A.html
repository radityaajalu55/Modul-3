<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Belajar Membuat Form</title>
</head>
<body>
  <form action="formulir.html" method="get">

    <p>
      <label for="nama">Nama:</label>
      <input type="text" id="nama" name="nama" placeholder="Nama Kamu">
    </p>

    <p>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password">
    </p>

    <p>
      Jenis Kelamin:
      <input type="radio" id="laki" name="jenis_kelamin" value="laki-laki" checked>
      <label for="laki">Laki-Laki</label>
      <input type="radio" id="perempuan" name="jenis_kelamin" value="perempuan">
      <label for="perempuan">Perempuan</label>
    </p>

    <p>
      Hobi:
      <input type="checkbox" id="baca" name="hobi[]" value="membaca">
      <label for="baca">Membaca Buku</label>
      <input type="checkbox" id="nulis" name="hobi[]" value="menulis" checked>
      <label for="nulis">Menulis</label>
      <input type="checkbox" id="mancing" name="hobi[]" value="memancing">
      <label for="mancing">Memancing</label>
    </p>

    <p>
      <label for="kota">Asal Kota:</label>
      <select id="kota" name="asal_kota">
        <option value="Jakarta">Jakarta</option>
        <option value="Bandung">Bandung</option>
        <option value="Semarang" selected>Semarang</option>
      </select>
    </p>

    <p>
      <label for="komentar">Komentar Anda:</label><br>
      <textarea id="komentar" name="komentar" rows="5" cols="20">Silahkan katakan isi hati anda</textarea>
    </p>

    <p>
      <input type="submit" value="Mulai Proses!">
    </p>

  </form>
</body>
</html>
